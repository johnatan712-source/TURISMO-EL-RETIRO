<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guía turística de El Retiro, Antioquia: lugares, rutas en bici, senderismo, comida, ebanistería, historia y la Fiesta de los Negritos.">
<meta name="theme-color" content="#21734A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Retiro">
<title>Turismo El Retiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Gochi+Hand&display=swap">
<style>
/* Layout: tablet-first app. Icon rail on the left (bottom bar on phones), one big scrolling screen. Palette from the child's drawing: orange cloud, forest green, coffee brown, sky blue, festival red. */
:root{
  --bg:#F3F6F1; --card:#FFFFFF; --ink:#1A2A22; --muted:#5A6B61; --line:#DCE3DA;
  --green:#21734A; --green-soft:#DDEFE3; --blue:#1D6FB8; --blue-soft:#DDEBF8;
  --orange:#E07A2E; --orange-soft:#FCE9D9; --coffee:#6B4128; --coffee-soft:#F1E3D6;
  --red:#C7344D; --red-soft:#F9DEE3; --sun:#F0B429; --sun-soft:#FDF1D3;
  --purple:#6B4FB3; --purple-soft:#E8E2F7; --map:#E9F0E4; --mapline:#C9D6C3;
  --wood:#9A5A22; --wood-soft:#F6E6D2; --teal:#127A7E; --teal-soft:#D8EFEF;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-kid:"Gochi Hand","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --card:#18231C; --ink:#E9F1EA; --muted:#A2B3A8; --line:#2B3B31;
  --green:#5CC98E; --green-soft:#1C3527; --blue:#7DB8F0; --blue-soft:#182C40;
  --orange:#F29A55; --orange-soft:#3B2615; --coffee:#D9A77E; --coffee-soft:#33241A;
  --red:#F07C90; --red-soft:#3D1C23; --sun:#F5C759; --sun-soft:#3A3015;
  --purple:#B3A0F0; --purple-soft:#2A2340; --map:#16241B; --mapline:#2C3E32;
  --wood:#E2A468; --wood-soft:#3A2816; --teal:#5CC9C9; --teal-soft:#173535; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --card:#18231C; --ink:#E9F1EA; --muted:#A2B3A8; --line:#2B3B31;
  --green:#5CC98E; --green-soft:#1C3527; --blue:#7DB8F0; --blue-soft:#182C40;
  --orange:#F29A55; --orange-soft:#3B2615; --coffee:#D9A77E; --coffee-soft:#33241A;
  --red:#F07C90; --red-soft:#3D1C23; --sun:#F5C759; --sun-soft:#3A3015;
  --purple:#B3A0F0; --purple-soft:#2A2340; --map:#16241B; --mapline:#2C3E32;
  --wood:#E2A468; --wood-soft:#3A2816; --teal:#5CC9C9; --teal-soft:#173535; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}

.app{display:grid;grid-template-columns:118px minmax(0,1fr);height:100%}
.rail{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:14px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
.rail .mini{display:grid;place-items:center;padding:4px 0 10px;background:none;border:0}
.rail .mini svg{width:76px;height:auto}
.nav{background:none;border:0;border-radius:16px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--muted);line-height:1.15;text-align:center}
.nav .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.nav .ic svg{width:26px;height:26px}
.nav[aria-current="page"]{color:var(--ink);background:var(--bg)}
.nav[aria-current="page"] .ic{color:#fff;background:var(--c)}
main{overflow-y:auto;height:100%;scroll-behavior:smooth}
.page{max-width:1100px;margin:0 auto;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));overflow-x:auto}
  .rail .mini{display:none}
  .nav{min-width:76px;font-size:11.5px}
  .nav .ic{width:38px;height:38px}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;gap:20px}
}

.head{display:flex;flex-direction:column;gap:6px}
.head .kicker{font-family:var(--f-kid);font-size:24px;color:var(--c,var(--orange));line-height:1}
.head h1{font-size:clamp(34px,4.6vw,52px);font-weight:800}
.head p{color:var(--muted);font-size:18px;max-width:62ch}
.back{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800}

/* ---------- inicio ---------- */
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:330px;display:flex;align-items:flex-end;background:var(--green)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(8,22,14,.78))}
.hero-in{position:relative;z-index:1;padding:26px 28px;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;color:#fff}
.hero-logo{background:#fff;border-radius:24px;padding:10px 12px 6px;width:190px;max-width:100%;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.hero-logo svg{display:block;width:100%;height:auto}
.hero-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 300px}
.hero-txt .kid{font-family:var(--f-kid);font-size:28px;color:#FFD27A;line-height:1}
.hero-txt h1{font-size:clamp(36px,5vw,58px);font-weight:800;color:#fff}
.hero-txt p{font-size:18px;opacity:.95;max-width:52ch}
.ask{font-family:var(--f-display);font-size:30px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:140px}}
.steps5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.steps5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.stp .n{width:40px;height:40px;border-radius:50%;background:var(--wood);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.stp b{font-family:var(--f-display);font-size:19px;line-height:1.1}
.stp p{font-size:14.5px;color:var(--muted)}
.mode{display:flex;gap:12px;flex-wrap:wrap}
.mode button{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:12px 22px;display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:22px;font-weight:800}
.mode button svg{width:30px;height:30px}
.mode button[aria-pressed="true"]{border-color:var(--mc);background:var(--mc);color:#fff}
.hikes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:980px){.hikes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.hikes{grid-template-columns:minmax(0,1fr)}}
.hike{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.hike .ph{aspect-ratio:16/10}
.hike .hb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.hike .hb b.t{font-family:var(--f-display);font-size:22px;line-height:1.1}
.hike .hb p{font-size:15px;color:var(--muted)}
.hstats{display:flex;gap:8px;flex-wrap:wrap}
.hstats span{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.hike .btn{margin-top:auto;align-self:flex-start;padding:9px 14px;font-size:15px}
.kit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kit{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kit button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;text-align:left}
.kit button .cb{width:28px;height:28px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;flex:none;font-size:18px;color:#fff}
.kit button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.kit button[aria-pressed="true"] .cb{background:var(--green);border-color:var(--green)}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.why{grid-template-columns:minmax(0,1fr)}}
.why div{background:var(--wood-soft);border-radius:18px;padding:14px 16px}
.why b{font-family:var(--f-display);font-size:20px;color:var(--wood);display:block;line-height:1.1}
.why p{font-size:15px}
.tile{border:0;border-radius:24px;padding:20px;text-align:left;background:var(--c);color:#fff;display:flex;flex-direction:column;gap:10px;min-height:170px;justify-content:space-between;position:relative;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .big{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tile .big svg{width:34px;height:34px}
.tile b{font-family:var(--f-display);font-size:26px;line-height:1.05;display:block}
.tile small{font-size:15px;opacity:.95;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qf{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.qf b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.qf span{font-size:14px;color:var(--muted);font-weight:700}

/* ---------- visitar ---------- */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:minmax(0,1fr)}}
.pcard{border:1px solid var(--line);background:var(--card);border-radius:22px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--green)}
.ph{aspect-ratio:4/3;width:100%;max-width:100%;position:relative;background:var(--map);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .stamp{position:absolute;top:10px;right:10px;background:var(--green);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
.nophoto{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);border:3px dashed var(--line);margin:10px;border-radius:16px;height:calc(100% - 20px);text-align:center;padding:10px}
.nophoto svg{width:40px;height:40px}
.nophoto span{font-family:var(--f-kid);font-size:20px;line-height:1.1}
.pbody{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px}
.pbody b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.pbody small{color:var(--muted);font-size:15px}
.tag{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:8px;background:var(--cs);color:var(--c)}
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:minmax(0,1fr)}}
.detail .ph{border-radius:24px;aspect-ratio:4/3}
.credit{font-size:12px;color:var(--muted);margin-top:6px}
.dtext{display:flex;flex-direction:column;gap:14px}
.dtext h1{font-size:clamp(32px,4vw,46px)}
.dtext p{font-size:18px}
.tip{background:var(--sun-soft);border-radius:16px;padding:14px 16px;font-size:16px}
.tip b{font-family:var(--f-display);font-size:18px;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:13px 20px;font-weight:800;font-size:17px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn-main{background:var(--green);color:#fff}
.btn-ghost{background:var(--card);border:2px solid var(--line);color:var(--ink)}

/* ---------- rutas ---------- */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:900px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rlist{display:flex;flex-direction:column;gap:12px}
.rbtn{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:14px;align-items:center}
.rbtn[aria-pressed="true"]{border-color:var(--rc);box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 25%,transparent)}
.rbtn .dot{width:14px;height:44px;border-radius:8px;background:var(--rc)}
.rbtn b{font-family:var(--f-display);font-size:21px;line-height:1.1;display:block}
.rbtn small{color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums}
.lvl{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.mapbox{background:var(--map);border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mlabel{font-family:var(--f-body);font-size:13px;font-weight:800;fill:var(--muted)}
.mtown{font-family:var(--f-display);font-size:17px;font-weight:800;fill:var(--ink)}
.rstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.rstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rstats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.rstats b{font-family:var(--f-display);font-size:26px;display:block;line-height:1;font-variant-numeric:tabular-nums}
.rstats span{font-size:13px;color:var(--muted);font-weight:700}
.profile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.profile svg{display:block;width:100%;height:auto}
.axis{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.src{font-size:13px;color:var(--muted)}

/* ---------- comer / dormir / pauta ---------- */
.fsec{display:flex;flex-direction:column;gap:12px}
.fsec-h{display:flex;align-items:center;gap:12px}
.fsec-h .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.fsec-h .ic svg{width:28px;height:28px}
.fsec-h h2{font-size:28px}
.fsec-h p{color:var(--muted);font-size:15px}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.frow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.frow{grid-template-columns:minmax(0,1fr)}}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fcard b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.fcard p{font-size:15px;color:var(--muted)}
.hours{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.open{align-self:flex-start;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px}
.open.yes{background:var(--green-soft);color:var(--green)}
.open.no{background:var(--red-soft);color:var(--red)}
.ad{border:3px dashed var(--orange);background:var(--orange-soft);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.ad .lab{position:absolute;top:-12px;left:14px;background:var(--orange);color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:999px}
.ad b{font-family:var(--f-display);font-size:20px;line-height:1.1;margin-top:4px}
.ad p{font-size:15px}
.banner{border-radius:22px;padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--orange);color:#fff;position:relative}
.banner .lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.25);padding:2px 10px;border-radius:999px}
.banner b{font-family:var(--f-display);font-size:26px;line-height:1.05}
.banner p{font-size:16px}
.banner .grow{flex:1 1 260px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.note{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.plan.star{border-color:var(--orange)}
.plan h3{font-size:24px}
.price{font-family:var(--f-display);font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--orange)}
.price small{font-size:16px;color:var(--muted);font-family:var(--f-body)}
.plan ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.money{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.money td{padding:8px 0;border-bottom:1px solid var(--line)}
.money td:last-child{text-align:right;font-weight:800}
.money tr:last-child td{border-bottom:0;font-size:18px;color:var(--green)}

/* ---------- historia ---------- */
.fiesta{border-radius:28px;background:var(--red);color:#fff;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;position:relative;overflow:hidden}
@media (max-width:900px){.fiesta{grid-template-columns:minmax(0,1fr)}}
.fiesta h2{font-size:clamp(32px,4vw,46px);color:#fff}
.fiesta .kid{font-family:var(--f-kid);font-size:24px;color:#FFE08A}
.fiesta p{font-size:17px}
.confetti{position:absolute;inset:0;pointer-events:none;opacity:.35}
.fdays{display:flex;flex-direction:column;gap:10px;position:relative}
.fday{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.fday .d{background:#fff;color:var(--red);border-radius:12px;text-align:center;padding:4px 0;font-family:var(--f-display);font-weight:800;line-height:1}
.fday .d b{font-size:28px;display:block}
.fday .d span{font-size:12px}
.fday.main{background:#fff;color:var(--ink)}
.fday.main .d{background:var(--red);color:#fff}
.comparsas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.comparsas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.comp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.comp .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.comp .ic svg{width:28px;height:28px}
.comp b{font-family:var(--f-display);font-size:19px;line-height:1.1}
.comp p{font-size:14.5px;color:var(--muted)}
.tl{display:flex;flex-direction:column;border-left:4px solid var(--line);margin-left:10px}
.tl div{position:relative;padding:0 0 22px 24px}
.tl div::before{content:"";position:absolute;left:-14px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--sun);border:4px solid var(--bg)}
.tl b{font-family:var(--f-display);font-size:24px;color:var(--coffee);line-height:1.1;font-variant-numeric:tabular-nums}
.tl p{font-size:17px;max-width:64ch}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h2{font-size:26px}
.box h3{font-size:21px}

/* ---------- diario ---------- */
.passport{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:620px){.passport{grid-template-columns:repeat(3,minmax(0,1fr))}}
.st{border:3px dashed var(--line);background:var(--card);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;text-align:center}
.st svg{width:34px;height:34px;opacity:.35}
.st span{font-size:11.5px;font-weight:800;line-height:1.1;color:var(--muted)}
.st.on{border:3px solid var(--green);background:var(--green-soft);transform:rotate(-6deg)}
.st.on svg{opacity:1;color:var(--green)}
.st.on span{color:var(--green)}
textarea,select{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical;font-family:var(--f-kid);font-size:22px}
.entry{border-left:6px solid var(--sun);background:var(--card);border-radius:0 16px 16px 0;padding:12px 16px}
.entry small{color:var(--muted);font-size:13px;font-weight:800}
.entry p{font-family:var(--f-kid);font-size:22px;line-height:1.25}

/* ---------- proyecto ---------- */
.logoevo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.logoevo{grid-template-columns:minmax(0,1fr)}}
.logoevo figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.logoevo img{border-radius:12px;max-height:340px;width:auto}
.logoevo .lg{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:330px}
.logoevo .lg svg{display:block;width:100%;height:auto}
.logoevo figcaption{font-size:14px;color:var(--muted);text-align:center}
.arrow{font-family:var(--f-kid);font-size:24px;color:var(--orange);text-align:center}
.canvas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.canvas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.canvas{grid-template-columns:minmax(0,1fr)}}
.canvas .box ul{margin:0;padding-left:20px;font-size:15.5px;display:flex;flex-direction:column;gap:4px}
.canvas .box p{font-size:15.5px}
.q{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.pitch{background:var(--green);color:#fff;border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.pitch .q{color:#FFD27A}
.pitch p{font-family:var(--f-kid);font-size:25px;line-height:1.3}
.credits{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:no-preference){.page>*{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}}

function photo(p){
  return p.photo?`<img src="${p.photo}" alt="${esc(p.name)}">`
    :`<div class="nophoto">${ic('camera',1.8)}<span>Foto por tomar en la salida de campo</span></div>`;
}
function vVisitar(){
  if(S.place) return vPlace(P(S.place));
  const f=S.filter,list=PLACES.filter(p=>f==='todos'||p.cat===f);
  return `${head('Toca una foto para saber más','Qué visitar',`${PLACES.length} lugares increíbles. Llevas ${S.visited.size} sellos en tu pasaporte.`,'var(--green)')}

  <div class="cards">${list.map(p=>`<button class="pcard" data-place="${p.id}">
    <div class="ph">${photo(p)}${S.visited.has(p.id)?'<span class="stamp">✓ Visitado</span>':''}</div>
    <div class="pbody"><span class="tag" style="--c:${CAT[p.cat].c};--cs:${CAT[p.cat].cs}">${CAT[p.cat].t}</span><b>${p.name}</b><small>${p.short}</small></div>

}

  const v=S.visited.has(p.id);

];
function routeMap(){
  const lake=xy([6.112,-75.507]);
  const lines=ROUTES.map(r=>{const d=r.pts.map(xy).map(p=>p.join(',')).join(' ');const on=r.id===S.route;
    return `<polyline points="${d}" fill="none" stroke="${r.color}" stroke-width="${on?7:3.5}" stroke-linejoin="round" stroke-linecap="round" opacity="${on?1:.28}" data-route="${r.id}" style="cursor:pointer"/>`});
  const sel=ROUTES.find(r=>r.id===S.route);const ordered=[...lines.filter((l,i)=>ROUTES[i].id!==S.route),lines[ROUTES.indexOf(sel)]];
  const labs=LABELS.map(l=>{const[x,y]=xy(l.p);return `<circle cx="${x}" cy="${y}" r="${l.town?9:5}" fill="${l.town?'var(--red)':'var(--muted)'}" stroke="var(--card)" stroke-width="3"/><text class="${l.town?'mtown':'mlabel'}" x="${+x+l.dx}" y="${+y+l.dy}" text-anchor="${l.a}">${l.t}</text>`}).join('');
  const grid=[...Array(7)].map((_,i)=>`<line x1="0" x2="${MW}" y1="${i*MH/6}" y2="${i*MH/6}" stroke="var(--mapline)" stroke-width="1"/><line y1="0" y2="${MH}" x1="${i*MW/6}" x2="${i*MW/6}" stroke="var(--mapline)" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${MW} ${MH}" role="img" aria-label="Mapa de las rutas en bicicleta desde el parque de El Retiro">
    <rect width="${MW}" height="${MH}" fill="var(--map)"/>${grid}
    <ellipse cx="${lake[0]}" cy="${lake[1]}" rx="16" ry="34" fill="var(--blue-soft)" stroke="var(--blue)" stroke-opacity=".35"/>
    ${ordered.join('')}${labs}
    <text class="mlabel" x="${MW-12}" y="24" text-anchor="end">N ↑</text>
  </svg>`;
}
function elevation(r){
  const W=600,H=170,L=46,R=10,T=12,Bt=26;
  const alts=r.pts.map(p=>p[2]);
  const d=[0];for(let i=1;i<r.pts.length;i++){const a=r.pts[i-1],b=r.pts[i];const dy=(b[0]-a[0])*111.2,dx=(b[1]-a[1])*110.6;d.push(d[i-1]+Math.hypot(dx,dy))}
  const tot=d[d.length-1],sc=r.km/tot;
  const lo=2000,hi=2700;
  const X=v=>L+(v*sc)/r.km*(W-L-R),Y=a=>T+(hi-a)/(hi-lo)*(H-T-Bt);
  const line=alts.map((a,i)=>`${X(d[i]).toFixed(1)},${Y(a).toFixed(1)}`).join(' ');
  const yt=[2100,2300,2500,2700].map(a=>`<line x1="${L}" x2="${W-R}" y1="${Y(a)}" y2="${Y(a)}" stroke="var(--line)"/><text class="axis" x="${L-6}" y="${Y(a)+4}" text-anchor="end">${a.toLocaleString('es-CO')} m</text>`).join('');
  const step=r.km>40?20:10,xt=[];for(let k=0;k<=r.km;k+=step)xt.push(`<text class="axis" x="${X(k/sc)}" y="${H-6}" text-anchor="middle">${k} km</text>`);
  const top=Math.max(...alts),ti=alts.indexOf(top);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Subidas y bajadas de la ruta">${yt}${xt.join('')}
    <polygon points="${X(0)},${Y(lo)} ${line} ${X(tot)},${Y(lo)}" fill="${r.color}" opacity=".16"/>
    <polyline points="${line}" fill="none" stroke="${r.color}" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${X(d[ti])}" cy="${Y(top)}" r="5" fill="${r.color}" stroke="var(--card)" stroke-width="2"/>
    <text class="axis" x="${Math.min(X(d[ti]),W-60)}" y="${Y(top)-9}" text-anchor="middle" style="font-weight:800;fill:var(--ink)">${top.toLocaleString('es-CO')} m</text></svg>`;
}

const VIEWS={inicio:vInicio,visitar:vVisitar,rutas:vRutas,comer:vComer,comprar:vComprar,dormir:vDormir,historia:vHistoria,diario:vDiario,anuncia:vAnuncia,proyecto:vProyecto};

function render(top=true){
  $('#rail').innerHTML=`<button class="mini" data-go="inicio" aria-label="Inicio">${LOGO}</button>`+NAV.map(n=>`<button class="nav" style="--c:${n.c}" data-go="${n.id}" ${S.view===n.id?'aria-current="page"':''}><span class="ic">${ic(n.i)}</span>${n.t}</button>`).join('');
  const m=$('#main'),keep=m.scrollTop;
  m.innerHTML=`<div class="page">${VIEWS[S.view]()}</div>`;
  m.scrollTop=top?0:keep;
}
function go(v){S.view=VIEWS[v]?v:'inicio';S.place=null;try{if(location.hash!=='#'+S.view)history.replaceState(null,'','#'+S.view)}catch(e){}render()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-place],[data-back],[data-filter],[data-route],[data-stamp],[data-jump],[data-mode],[data-kit],[data-goplace]');if(!b)return;const d=b.dataset;
  if(d.mode){S.rmode=d.mode;render(false);return}
  if(d.kit){const k=+d.kit;S.kit.has(k)?S.kit.delete(k):S.kit.add(k);render(false);return}
  if(d.goplace){go('visitar');S.place=d.goplace;render();return}
  if(d.jump){e.preventDefault();document.getElementById(d.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.go){go(d.go);return}
  if(d.place){S.place=d.place;render();return}
  if('back' in d){S.place=null;render();return}
  if(d.filter){S.filter=d.filter;render(false);return}
  if(d.route){S.route=d.route;render(false);return}
  if(d.stamp){S.visited.has(d.stamp)?S.visited.delete(d.stamp):S.visited.add(d.stamp);store.set('visited',[...S.visited]);render(false)}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='dform')return;e.preventDefault();
  const text=$('#dtext').value.trim();if(!text){$('#dtext').focus();return}
  const place=$('#dplace').value;
  S.diary=S.diary.filter(x=>x.date!=='Ejemplo');
  S.diary.push({place,text,date:new Date().toLocaleDateString('es-CO',{day:'numeric',month:'short'})});
  store.set('diary',S.diary);S.visited.add(place);store.set('visited',[...S.visited]);render(false);
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==S.view&&VIEWS[h]){S.view=h;S.place=null;render()}});
{const h=location.hash.slice(1);if(VIEWS[h])S.view=h;}
render();
</script>
